<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin – Massage bei Marlon</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1eb;
      color: #29342c;
    }

    header {
      background: white;
      padding: 18px 25px;
      border-bottom: 1px solid #ddd;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: #637b67;
      text-decoration: none;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      margin: 20px 0;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 36px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #7f9b83;
      color: white;
    }

    .secondary {
      background: #e9eee9;
      color: #29342c;
    }

    .danger {
      background: #f4dddd;
      color: #9e3333;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #b33d3d;
    }

    .success {
      color: #53715a;
    }

    .appointment,
    .slot {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 18px;
      margin-top: 12px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .logout {
      width: auto;
    }

    .slot button,
    .appointment button {
      margin-top: 15px;
    }

  </style>

</head>


<body>


<header>

  <strong>
    Massage bei Marlon – Admin
  </strong>

  <a href="index.html">
    Kundenbereich
  </a>

</header>


<main>


<!-- ================================
     LOGIN
================================ -->

<section id="login">

  <div class="card">

    <h1>Admin Login</h1>

    <p>
      Melde dich an, um deine Massage-Termine zu verwalten.
    </p>


    <label>

      E-Mail

      <input
        id="email"
        type="email"
        placeholder="Deine E-Mail"
        autocomplete="email"
      >

    </label>


    <label>

      Passwort

      <input
        id="password"
        type="password"
        placeholder="Dein Passwort"
        autocomplete="current-password"
      >

    </label>


    <button
      type="button"
      class="primary"
      onclick="login()"
    >
      Einloggen
    </button>


    <p
      id="loginError"
      class="error"
    ></p>

  </div>

</section>



<!-- ================================
     DASHBOARD
================================ -->

<section
  id="dashboard"
  class="hidden"
>


  <div class="top">

    <h1>Dashboard</h1>

    <button
      type="button"
      class="secondary logout"
      onclick="logout()"
    >
      Abmelden
    </button>

  </div>



  <!-- ================================
       FREIE ZEIT HINZUFÜGEN
  ================================= -->

  <div class="card">

    <h2>
      Freie Massagezeit hinzufügen
    </h2>


    <label>

      Datum

      <input
        id="slotDate"
        type="date"
      >

    </label>


    <label>

      Uhrzeit

      <input
        id="slotTime"
        type="time"
        value="14:00"
      >

    </label>


    <button
      type="button"
      class="primary"
      onclick="addSlot()"
    >
      Freie Zeit hinzufügen
    </button>


    <p
      id="slotMessage"
      class="success"
    ></p>

  </div>



  <!-- ================================
       FREIE ZEITEN
  ================================= -->

  <div class="card">

    <h2>
      Meine freien Zeiten
    </h2>

    <div id="slots">
      Lade...
    </div>

  </div>



  <!-- ================================
       GEBUCHTE TERMINE
  ================================= -->

  <div class="card">

    <h2>
      Gebuchte Termine
    </h2>

    <div id="appointments">
      Lade...
    </div>

  </div>


</section>


</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/*
====================================
SUPABASE
====================================
*/

const SUPABASE_URL =
  "https://bxwvirthjxpxytvwkcap.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CvYQjQMtP9Kwkl10ZcMNXQ_vjgwrhhS";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/*
====================================
LOGIN
====================================
*/

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const error =
    document
      .getElementById("loginError");

  error.textContent = "";


  if (!email || !password) {

    error.textContent =
      "Bitte E-Mail und Passwort eingeben.";

    return;
  }


  const result =
    await db.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (result.error) {

    error.textContent =
      "Fehler: " +
      result.error.message;

    return;
  }


  await showDashboard();

}



/*
====================================
DASHBOARD ANZEIGEN
====================================
*/

async function showDashboard() {

  document
    .getElementById("login")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  await loadSlots();

  await loadAppointments();

}



/*
====================================
LOGOUT
====================================
*/

async function logout() {

  await db.auth.signOut();

  location.reload();

}



/*
====================================
LOGIN BEIM START PRÜFEN
====================================
*/

async function checkLogin() {

  const result =
    await db.auth.getSession();


  if (
    result.data &&
    result.data.session
  ) {

    await showDashboard();

  }

}



/*
====================================
FREIE ZEIT HINZUFÜGEN
====================================

Jede Massage dauert GENAU 15 MINUTEN.

Beispiel:

14:00 → 14:15
14:15 → 14:30
14:30 → 14:45
====================================
*/

async function addSlot() {

  const date =
    document
      .getElementById("slotDate")
      .value;

  const time =
    document
      .getElementById("slotTime")
      .value;

  const message =
    document
      .getElementById("slotMessage");


  message.textContent = "";


  if (!date || !time) {

    message.textContent =
      "Bitte Datum und Uhrzeit auswählen.";

    return;

  }


  /*
  Startzeit
  */

  const start =
    time + ":00";


  /*
  Uhrzeit auseinandernehmen
  */

  const hour =
    parseInt(
      time.substring(0, 2),
      10
    );

  const minute =
    parseInt(
      time.substring(3, 5),
      10
    );


  /*
  GENAU 15 MINUTEN DAZU
  */

  const totalMinutes =
    hour * 60 +
    minute +
    15;


  /*
  Endzeit berechnen
  */

  const endHour =
    String(
      Math.floor(totalMinutes / 60) % 24
    ).padStart(2, "0");


  const endMinute =
    String(
      totalMinutes % 60
    ).padStart(2, "0");


  const end =
    endHour +
    ":" +
    endMinute +
    ":00";


  /*
  IN SUPABASE SPEICHERN
  */

  const result =
    await db
      .from("availability")
      .insert({

        date: date,

        start_time: start,

        end_time: end,

        available: true

      });


  if (result.error) {

    message.textContent =
      "Fehler: " +
      result.error.message;

    return;

  }


  message.textContent =
    "Freie Zeit wurde hinzugefügt.";


  await loadSlots();

}



/*
====================================
FREIE ZEITEN LADEN
====================================
*/

async function loadSlots() {

  const container =
    document.getElementById("slots");


  container.innerHTML =
    "<p>Lade...</p>";


  const today =
    new Date()
      .toISOString()
      .split("T")[0];


  const result =
    await db
      .from("availability")
      .select("*")
      .gte(
        "date",
        today
      )
      .order("date")
      .order("start_time");


  if (result.error) {

    container.innerHTML =
      "<p class='error'>" +
      "Fehler beim Laden: " +
      escapeHtml(result.error.message) +
      "</p>";

    return;

  }


  if (
    !result.data ||
    !result.data.length
  ) {

    container.innerHTML =
      "<p>Noch keine freien Zeiten.</p>";

    return;

  }


  container.innerHTML = "";


  result.data.forEach(slot => {

    const div =
      document.createElement("div");


    div.className =
      "slot";


    div.innerHTML = `

      <strong>
        ${formatDate(slot.date)}
      </strong>

      <br>

      ${slot.start_time.substring(0, 5)}
      Uhr

      <button
        type="button"
        class="danger"
        onclick="deleteSlot('${slot.id}')"
      >
        Freie Zeit löschen
      </button>

    `;


    container.appendChild(div);

  });

}



/*
====================================
FREIE ZEIT LÖSCHEN
====================================
*/

async function deleteSlot(id) {

  alert("deleteSlot wurde aufgerufen. ID: " + id);

  const result = await db
    .from("availability")
    .delete()
    .eq("id", id);

  alert(
    result.error
      ? "FEHLER: " + result.error.message
      : "LÖSCHEN ERFOLGREICH"
  );

  await loadSlots();
}


/*
====================================
TERMINE LADEN
====================================
*/

async function loadAppointments() {

  const container =
    document.getElementById("appointments");


  container.innerHTML =
    "<p>Lade...</p>";


  const result =
    await db
      .from("appointments")
      .select("*")
      .neq(
        "status",
        "cancelled"
      )
      .order("date")
      .order("start_time");


  if (result.error) {

    container.innerHTML =
      "<p class='error'>" +
      "Fehler beim Laden: " +
      escapeHtml(result.error.message) +
      "</p>";

    return;

  }


  if (
    !result.data ||
    !result.data.length
  ) {

    container.innerHTML =
      "<p>Noch keine Buchungen.</p>";

    return;

  }


  container.innerHTML = "";


  result.data.forEach(
    appointment => {

      const div =
        document.createElement("div");


      div.className =
        "appointment";


      div.innerHTML = `

        <strong>
          ${formatDate(appointment.date)}
        </strong>

        <br>

        ${appointment.start_time.substring(0,5)}
        Uhr

        <p>
          Kunde:
          ${escapeHtml(
            appointment.customer_name
          )}
        </p>

        <p>
          Status:
          ${escapeHtml(
            appointment.status
          )}
        </p>

        ${
          appointment.message
          ?
          `
            <p>
              Nachricht:
              ${escapeHtml(
                appointment.message
              )}
            </p>
          `
          :
          ""
        }

        <p>
          Buchungscode:
          <strong>
            ${escapeHtml(
              appointment.booking_code
            )}
          </strong>
        </p>

        <button
          type="button"
          class="danger"
        >
          Termin stornieren
        </button>

      `;


      const button =
        div.querySelector("button");


      button.addEventListener(
        "click",
        function() {

          cancelAppointment(
            appointment.id
          );

        }
      );


      container.appendChild(div);

    }
  );

}



/*
====================================
TERMIN STORNIEREN
====================================
*/

async function cancelAppointment(id) {

  alert("cancelAppointment wurde aufgerufen. ID: " + id);

  const result = await db
    .from("appointments")
    .update({
      status: "cancelled"
    })
    .eq("id", id);

  alert(
    result.error
      ? "FEHLER: " + result.error.message
      : "STORNIEREN ERFOLGREICH"
  );

  await loadAppointments();
}


/*
====================================
DATUM FORMATIEREN
====================================
*/

function formatDate(date) {

  return new Intl.DateTimeFormat(
    "de-DE",
    {

      weekday: "long",

      day: "2-digit",

      month: "long",

      year: "numeric"

    }
  ).format(
    new Date(
      date +
      "T12:00:00"
    )
  );

}



/*
====================================
HTML SICHER MACHEN
====================================
*/

function escapeHtml(text) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/*
====================================
START
====================================
*/

checkLogin();

</script>


</body>

</html>
